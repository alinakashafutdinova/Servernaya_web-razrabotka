name: Проверка версии для хостинга (Laravel 13)

on:
  push:
    branches: [hosting-laravel13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel 13 · MySQL / SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: labs_testing
          MYSQL_USER: labs_test
          MYSQL_PASSWORD: labs_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=test-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, curl, xml, dom, fileinfo, pdo_sqlite, pdo_mysql, intl, zip
          coverage: none
      - name: Проверить синтаксис PHP
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Установить Composer
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Подготовить ключ приложения
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Проверить SQLite и все лабораторные
        run: php artisan test
      - name: Проверить миграции MySQL 8
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: labs_testing
          DB_USERNAME: labs_test
          DB_PASSWORD: labs_test_password
          MODERATOR_PASSWORD: ci-only-long-password-2026
          MAIL_MAILER: array
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:status
          php artisan route:list
      - name: Подготовить SQL для phpMyAdmin InfinityFree
        if: matrix.php == '8.3'
        run: |
          DB_CONTAINER="$(docker ps -q --filter ancestor=mysql:8.0 | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" mysql -ulabs_test -plabs_test_password labs_testing -e "DELETE FROM personal_access_tokens; DELETE FROM comments; DELETE FROM users;"
          docker exec "$DB_CONTAINER" mysqldump -ulabs_test -plabs_test_password --no-tablespaces --single-transaction --set-gtid-purged=OFF --skip-comments --default-character-set=utf8mb4 labs_testing roles users articles comments personal_access_tokens notifications migrations > infinityfree_init.sql
          test -s infinityfree_init.sql
          ! grep -q 'ci-only-long-password-2026' infinityfree_init.sql

      - name: Проверить SQL на MariaDB 10.6 как на InfinityFree
        if: matrix.php == '8.3'
        run: |
          docker run -d --name infinityfree-mariadb-test -e MARIADB_ROOT_PASSWORD=temporary-check -e MARIADB_DATABASE=infinityfree_demo mariadb:10.6
          trap 'docker rm -f infinityfree-mariadb-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if docker exec infinityfree-mariadb-test mariadb -uroot -ptemporary-check -e "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec -i infinityfree-mariadb-test mariadb -uroot -ptemporary-check infinityfree_demo < infinityfree_init.sql
          docker exec infinityfree-mariadb-test mariadb -uroot -ptemporary-check infinityfree_demo -e "SELECT COUNT(*) AS articles_count FROM articles; SELECT COUNT(*) AS roles_count FROM roles; SELECT COUNT(*) AS users_count FROM users;"
      - name: Собрать архив для хостинга с зависимостями
        if: matrix.php == '8.3'
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          mkdir -p /tmp/hosting-build
          rsync -a --exclude='.git' --exclude='.github' --exclude='.env' --exclude='infinityfree_init.sql' --exclude='tests' --exclude='.phpunit.result.cache' --exclude='storage/logs/*.log' ./ /tmp/hosting-build/site/
          cd /tmp/hosting-build
          zip -rq "${GITHUB_WORKSPACE}/laravel13-hosting-ready.zip" site
      - name: SQL для импорта в phpMyAdmin InfinityFree
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: infinityfree-database-sql
          path: infinityfree_init.sql
          retention-days: 30
      - name: Архив для скачивания (Actions → Artifacts)
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: laravel13-hosting-ready
          path: laravel13-hosting-ready.zip
          retention-days: 30
