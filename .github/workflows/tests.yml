name: Проверка лабораторных работ

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Проверка Laravel
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Подготовить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer:v2
          extensions: mbstring, xml, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Разрешить учебную проверку совместимости Laravel 9
        run: composer config policy.advisories.block false

      - name: Установить зависимости
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Подготовить окружение
        run: |
          cp .env.example .env
          echo "MODERATOR_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          php artisan key:generate

      - name: Проверить миграцию и наполнение базы
        run: |
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Выполнить тесты
        run: php artisan test

      - name: Проверить форму и CSRF через HTTP
        run: |
          php artisan serve --host=127.0.0.1 --port=8182 > /tmp/laravel-check.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python3 tests/http_registration_check.py

      - name: Проверить CRUD и CSRF через HTTP
        run: |
          php artisan serve --host=127.0.0.1 --port=8182 > /tmp/crud-check.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python3 tests/http_news_crud_check.py
