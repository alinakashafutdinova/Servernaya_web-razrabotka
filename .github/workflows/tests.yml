name: Проверка лабораторных работ

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Проверка Laravel
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Подготовить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer:v2
          extensions: mbstring, xml, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Разрешить учебную проверку совместимости Laravel 9
        run: composer config policy.advisories.block false

      - name: Установить зависимости
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Подготовить окружение
        run: |
          cp .env.example .env
          echo "MODERATOR_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          php artisan key:generate

      - name: Проверить миграцию и наполнение базы
        run: |
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force

      - name: Проверить PHP-скрипт локальной установки
        run: |
          php -l scripts/setup-local.php
          php -l app/Notifications/CommentModeratedNotification.php

      - name: Выполнить тесты
        run: php artisan test

      - name: Проверить форму и CSRF через HTTP
        run: |
          php artisan serve --host=127.0.0.1 --port=8182 > /tmp/laravel-check.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 tests/http_registration_check.py

      - name: Проверить CRUD и CSRF через HTTP
        env:
          MAIL_MAILER: log
        run: |
          php artisan serve --host=127.0.0.1 --port=8182 > /tmp/crud-check.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 tests/http_news_crud_check.py

      - name: Проверить модерацию комментариев через HTTP
        env:
          MAIL_MAILER: log
        run: |
          php artisan serve --host=127.0.0.1 --port=8182 > /tmp/moderation-check.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python3 tests/http_moderation_check.py

  local-ready-package:
    name: Собрать локальный ZIP с vendor + SQLite
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Получить проект
        uses: actions/checkout@v4

      - name: Подготовить PHP 8.0 и SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer:v2
          extensions: mbstring, xml, dom, fileinfo, pdo_sqlite
          coverage: none

      - name: Установить Composer-зависимости
        run: |
          composer config policy.advisories.block false
          composer install --no-interaction --prefer-dist --no-progress

      - name: Проверить автономную установку и создание локального пользователя
        run: |
          php -l scripts/setup-local.php
          php scripts/setup-local.php
          test -s database/database.sqlite
          test -s LOCAL_LOGIN.txt
          test -f vendor/autoload.php
          php artisan route:list >/tmp/local-routes.txt
          php artisan test --filter=LocalDeploymentTest

      - name: Создать portable ZIP для преподавателя (без .env и секретов)
        run: |
          mkdir -p /tmp/local-delivery/Servernaya_web_Laravel9_SQLite
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='LOCAL_LOGIN.txt' \
            --exclude='database/*.sqlite' \
            --exclude='storage/logs/*.log' \
            --exclude='.phpunit.result.cache' \
            --exclude='bootstrap/cache/*.php' \
            ./ /tmp/local-delivery/Servernaya_web_Laravel9_SQLite/
          cd /tmp/local-delivery
          zip -qr "$GITHUB_WORKSPACE/Laravel9_SQLite_local_ready.zip" Servernaya_web_Laravel9_SQLite
          test -s "$GITHUB_WORKSPACE/Laravel9_SQLite_local_ready.zip"

      - name: Приложить полный ZIP с зависимостями к Actions
        uses: actions/upload-artifact@v4
        with:
          name: Laravel9_SQLite_готовый_проект
          path: Laravel9_SQLite_local_ready.zip
          retention-days: 30
